name: ci

on:
  # `develop` is where autonomous merging happens, so it needs the checks at
  # least as much as `main` does: a "all checks green" predicate is satisfied
  # by an ABSENCE of checks just as happily as by passing ones. Identical job
  # set on both branches — no reduced coverage on the autonomous side.
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Release Please uses GITHUB_TOKEN, so its PR events do not run unattended.
  # release.yml dispatches this workflow explicitly on the release PR branch.
  workflow_dispatch: {}

jobs:
  install-conformance:
    name: install conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which areas the diff touches
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/changed-areas.sh
      - name: Offline tarball install and hook execution for Claude, Codex and both
        run: |
          pnpm conformance:install
          pnpm conformance:hooks
      - name: ProjectGraph tests and typecheck
        # The kernel's own suite. Nothing it asserts can change while
        # packages/harness-graph and packages/mission-engine are untouched.
        if: steps.areas.outputs.graph == 'true'
        run: |
          pnpm --filter @voidcorp/harness-graph test
          pnpm --filter @voidcorp/harness-graph typecheck
      - name: Deterministic packed ProjectGraph subpath conformance
        if: steps.areas.outputs.graph == 'true'
        run: pnpm conformance:project-graph

  validate:
    runs-on: ubuntu-latest
    env:
      # On pull requests, prove the reviewed branch commit rather than GitHub's
      # synthetic merge ref. Pushes and manual runs prove their triggering SHA.
      GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # decisions:check compares accepted records with the PR base SHA.
          # checkout fetches one commit by default, so retain the base history.
          fetch-depth: 0
          ref: ${{ env.GATE_SHA }}

      - name: Setup pnpm
        # No `version:` here: action-setup reads it from packageManager in
        # package.json (single source of truth). Specifying both errors with
        # ERR_PNPM_BAD_PM_VERSION on action-setup.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # verify-gates:begin
      - name: "[sister-docs] Sister-doc parity"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate sister-docs
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/sister-docs.json"

      - name: "[philosophy] Doctrine parity"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate philosophy
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/philosophy.json"

      - name: "[version-lockstep] Version lockstep"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate version-lockstep
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/version-lockstep.json"

      - name: "[anti-bloat] Anti-bloat"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate anti-bloat
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/anti-bloat.json"

      - name: "[decisions] Decision records"
        continue-on-error: true
        env:
          DECISIONS_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/verify.mjs --gate decisions
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/decisions.json"

      - name: "[hook-runner-current] Generated hook runner"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate hook-runner-current
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/hook-runner-current.json"

      - name: "[core-assets] Core assets mirror"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate core-assets
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/core-assets.json"

      - name: "[lint] Lint"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate lint
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/lint.json"

      - name: "[publish-safety] Publish safety"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate publish-safety
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/publish-safety.json"

      - name: "[package-size] Package size report"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate package-size
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/package-size.json"

      - name: "[build] Build packages"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate build
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/build.json"

      - name: "[self-host-sync] Self-host compile"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate self-host-sync
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/self-host-sync.json"

      - name: "[self-host-doctor] Self-host doctor"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate self-host-doctor
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/self-host-doctor.json"

      - name: "[graph-integrity] Graph integrity"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate graph-integrity
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/graph-integrity.json"

      - name: "[generated-artifacts] Generated artifacts"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate generated-artifacts
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/generated-artifacts.json"

      - name: "[consumer-bundle] Consumer bundle freshness"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate consumer-bundle
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/consumer-bundle.json"

      - name: "[asset-paths] Asset paths"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate asset-paths
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/asset-paths.json"

      - name: "[skill-references] Skill references"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate skill-references
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/skill-references.json"

      - name: "[test-cpu] CPU tests"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate test-cpu
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/test-cpu.json"

      - name: "[test-filesystem] Filesystem tests"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate test-filesystem
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/test-filesystem.json"

      - name: "[test-subprocess] Subprocess tests"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate test-subprocess
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/test-subprocess.json"

      - name: "[test-network] Network and browser tests"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate test-network
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/test-network.json"

      - name: "[typecheck] Typecheck"
        continue-on-error: true
        run: >-
          node scripts/verify.mjs --gate typecheck
          --sha "$GATE_SHA"
          --report ".void/machine/gate-reports/typecheck.json"

      - name: Aggregate exact-SHA gate reports
        if: ${{ !cancelled() }}
        run: >-
          node scripts/verify.mjs --aggregate --sha "$GATE_SHA"
          --reports ".void/machine/gate-reports"
      # verify-gates:end
