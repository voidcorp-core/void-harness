name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` here: action-setup reads it from packageManager in
        # package.json (single source of truth). Specifying both errors with
        # ERR_PNPM_BAD_PM_VERSION on action-setup.
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sister-doc parity (CLAUDE.md <-> AGENTS.md)
        # Section-heading parity after terminology normalization. Catches a
        # section added to one doc but not the other. The pre-commit hook
        # (.githooks/pre-commit) enforces the stricter both-or-neither rule
        # locally; CI enforces structural parity statelessly.
        run: pnpm sync:docs

      - name: Anti-bloat checks
        # Single source of truth: scripts/anti-bloat-check.sh enforces the size
        # caps (skills ≤400, hooks ≤100), hook shell syntax, AND the frontmatter
        # description ≤200 cap across skills + agents. Inlining a subset here let
        # the agent description cap go unenforced in CI (it only ran locally).
        run: pnpm anti-bloat:check

      - name: core-assets in sync with core
        # The CLI bundles packages/core as packages/cli/core-assets via
        # copy-core-assets.mjs. Regenerate and fail if the committed mirror
        # drifted, so the published CLI never ships a stale manifest or hooks.
        run: |
          pnpm --filter @voidcorp/harness build:assets
          if ! git diff --quiet -- packages/cli/core-assets; then
            echo "FAIL: core-assets is out of sync with packages/core." >&2
            echo "Run: pnpm --filter @voidcorp/harness build:assets" >&2
            git --no-pager diff --stat -- packages/cli/core-assets >&2
            exit 1
          fi

      - name: Lint — Biome
        run: pnpm lint

      - name: Publish safety (no workspace protocol in npm packages)
        run: pnpm check:publish

      - name: Build packages
        # Build before typecheck: packs resolve cross-package imports
        # (e.g. @voidcorp/pack-monorepo/result) through their dist exports,
        # so the type declarations must exist first.
        run: pnpm build

      - name: Skill tests
        run: pnpm vitest run

      - name: TypeScript — typecheck packages
        run: pnpm -r typecheck
