name: windows-rename-diagnosis
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @voidcorp/mission-engine build
      - name: Bounded reproduction, stop on first failure, never retry a failure
        shell: pwsh
        run: |
          foreach ($sample in 1..12) {
            Write-Output "Reproduction sample $sample/12; this is not merge evidence"
            pnpm --filter @voidcorp/harness-graph test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
