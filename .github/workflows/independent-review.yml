# The independent review of every pull request into develop, run by GitHub.
#
# `pull_request_target` on purpose: GitHub runs this workflow, its scripts and
# the review instructions from the default branch, main, which only a person
# merges into, so a pull request can rewrite none of them for its own review,
# and the model credential is never handed to code the pull request controls.
# A change here therefore reviews anything only once it is promoted to main. The head is checked out beside them as data, in
# `pr-head/`, and read with read-only tools; nothing from it is installed or
# run. This is the pattern GitHub and Anthropic document for untrusted heads.
#
# The verdict is the check run `independent-review` on the head SHA, created
# with a token of the review App, a GitHub App of its own: branch protection
# accepts the check from that App alone. Its key lives in the
# `independent-review` environment, limited to the default branch, which is where
# `pull_request_target` runs; a workflow pushed to any other branch can neither
# read it nor, with its GITHUB_TOKEN, create the check as the App. The job's own
# GITHUB_TOKEN only posts the verdict comment. This job is named `review`, never
# `independent-review`: a job skipped under the required name reports success.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target
# https://code.claude.com/docs/en/github-actions
name: independent-review

on:
  pull_request_target:
    branches: [develop]
    # A draft gets no review and no check, so it stays unmergeable until it is
    # marked ready, which triggers this.
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per head: a push while a review runs replaces it.
concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A draft is not reviewed: it gets no check and stays unmergeable until it is
    # marked ready, which triggers this again.
    if: ${{ github.event.pull_request.draft == false }}
    # The model credential and the review App's key live in this environment,
    # whose deployment branch policy admits main alone: a workflow pushed to any
    # other branch cannot read them, and `pull_request_target` runs on main.
    environment: independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/independent-review-check.mjs
            scripts/independent-review-run.mjs
            scripts/product-identity.mjs
            packages/core/data/identity.json
            .github/review
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      # No App token is alive while the model reads the head: the one that
      # opens the check is revoked at once, the one that concludes it is minted
      # after the review. The action alone revokes only when the job ends.
      # https://docs.github.com/en/rest/apps/installations#revoke-an-installation-access-token
      - name: Mint the review App token, allowed to write checks and nothing else
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
          skip-token-revoke: true
      - name: Decide whether this head is reviewed, and open its check
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/independent-review-run.mjs start
      - name: Revoke the token that opened the check
        if: always() && steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token
      - name: Check out the head, as data
        if: steps.start.outputs.review == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare the diff and the instructions
        id: inputs
        if: steps.start.outputs.review == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C pr-head diff "$BASE_SHA...$HEAD_SHA" > review/diff.patch
          printf 'schema=%s\n' "$(node -e 'process.stdout.write(JSON.stringify(require("./.github/review/verdict.schema.json")))')" >> "$GITHUB_OUTPUT"
      - name: Review
        id: claude
        if: steps.start.outputs.review == 'true'
        # A failed or empty review is judged by the next step, which fails the check.
        continue-on-error: true
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This job's token, not the Claude GitHub App's: nothing to install,
          # and Claude's read-only tools cannot use it anyway.
          github_token: ${{ github.token }}
          prompt: |
            Follow .github/review/prompt.md to review pull request #${{ github.event.pull_request.number }}
            at head ${{ github.event.pull_request.head.sha }}.
          # Turns bound the cost; the job's 30 minutes bound the time. 40 turns
          # ran out on a 166-file diff (#420: 41 turns, 4 minutes, about 1 USD)
          # and left it with no verdict at all, so a large change could never
          # merge. 120 keeps the worst case near 12 minutes and 3 USD.
          claude_args: >-
            --allowedTools Read,Grep,Glob
            --add-dir pr-head
            --max-turns 120
            --json-schema '${{ steps.inputs.outputs.schema }}'
      - name: Mint the review App token that concludes the check
        id: app-finish
        if: always() && steps.start.outputs.review == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Publish the verdict and conclude the check
        if: always() && steps.start.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app-finish.outputs.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_RUN_ID: ${{ steps.start.outputs.check_run_id }}
          REVIEW_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: node scripts/independent-review-run.mjs finish
