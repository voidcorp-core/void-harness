# Required check `independent-review` on the commit the merge queue tests.
#
# A merge group is a synthetic commit nobody reviewed. This workflow runs on
# `workflow_run` of `ci`, which every merge group triggers, so GitHub runs it from
# the default branch, main, whose environment holds the review App's key. It
# rebuilds the group from that run, requires every pull request of the group to
# carry a successful `independent-review` check from the review App on its own
# head, and posts the verdict on the group commit as the App, which is the
# check branch protection requires there too.
#
# Not a `merge_group` workflow: GitHub runs that one from the group commit,
# which the pull request can edit, and a main-only secret is out of its reach.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
name: independent-review-queue

# As soon as the group's CI starts: the verdict does not wait for it.
on:
  workflow_run:
    workflows: [ci]
    types: [requested]

permissions: {}

concurrency:
  group: independent-review-queue-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    # Every other ci run is a pull request or a push, which the review job covers.
    if: ${{ github.event.workflow_run.event == 'merge_group' }}
    environment: independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/independent-review-check.mjs
            scripts/product-identity.mjs
            packages/core/data/identity.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Mint the review App token, allowed to write checks and nothing else
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Verify the review of every head the group merges, and post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_APP_ID: ${{ vars.REVIEW_APP_ID }}
        run: node scripts/independent-review-check.mjs
