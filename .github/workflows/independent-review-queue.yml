# Required check `independent-review` in the merge queue of develop.
#
# The queue tests a synthetic group commit nobody reviewed, so this job proves
# that every pull request of the group carries a successful `independent-review`
# check run from GitHub Actions on its own head, published by the review job
# (independent-review.yml). It never reviews anything itself.
#
# Its own workflow, triggered by `merge_group` alone: in a workflow that also ran
# on pull requests, a job skipped under this required name would report success.
# The script comes from the base branch, so a pull request cannot rewrite it.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group
name: independent-review-queue

on:
  merge_group:
    types: [checks_requested]
    branches: [develop]

permissions: {}

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/independent-review-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify the review of every head the group merges
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/independent-review-check.mjs
