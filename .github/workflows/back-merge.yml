name: back-merge

# Carry what lands on main back down to develop.
#
# `main` is the release gate: a human promotes develop to main, and only then
# does release-please propose a release. Merging that release PR writes the
# version bumps and the changelog to main, so main gains commits develop does
# not have. Branch protection is `strict`, so the next promotion is refused
# until develop catches up.
#
# That divergence is not a wiring mistake to design away. It follows from main
# being the gate: pointing release-please at develop instead would propose a
# release the moment a commit lands there, which is before the human decision
# the gate exists to make. So the repair is automated rather than the cause
# removed, and this file is the honest version of that trade.
#
# It opens a pull request rather than pushing: develop is protected with
# enforce_admins, and a branch that only a robot may bypass is not protected.
# One click, and the checks run because the App token is not GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the back-merge when main holds something develop does not
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'voidcorp-release[bot]'
          git config user.email 'voidcorp-release[bot]@users.noreply.github.com'

          # Compare content, not commit counts. A promotion leaves a merge
          # commit on main that develop does not have, so counting commits would
          # open an empty pull request after every promotion, and a robot that
          # cries wolf gets merged without being read.
          if git diff --quiet origin/develop origin/main; then
            echo "develop and main hold the same tree; nothing to back-merge."
            exit 0
          fi

          branch="chore/back-merge-main"
          git checkout -B "$branch" origin/develop
          # A conflict here is a real event, not a hiccup: it means develop and
          # main both changed a file release-please owns. Fail loudly rather than
          # resolve it unattended.
          if ! git merge --no-edit origin/main; then
            echo "back-merge conflicts; resolve it by hand." >&2
            exit 1
          fi
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            # printf rather than a literal multi-line string: a body line at
            # column zero ends the YAML block scalar, which is what made this
            # workflow unparseable on its first real run. The sibling workflow
            # survived only because it already used this form.
            (gh pr create --base develop --head "$branch" \
              --title 'chore: back-merge main into develop' \
              --body "$(printf '%s\n\n%s\n' \
                'Release-please writes the version bumps and the changelog to `main`, so `main` gains commits `develop` does not have and branch protection refuses the next promotion until they meet. This carries them back down.' \
                'Merged automatically once the required checks pass, and only then. Its whole content is the release output a human already approved by merging the release pull request; asking for it to be read a second time is ceremony, not review. Anything carrying a diff nobody has read still stops at a human, which is why autopilot refuses --auto-merge and this does not.')" \
              >/dev/null)
            # `gh pr create` prints a URL, not JSON, so the number is read back
            # from the branch rather than parsed out of its output.
            existing=$(gh pr view "$branch" --json number --jq '.number')
          else
            echo "back-merge pull request already open; it now carries the newer main."
          fi

          # Native auto-merge, which waits for the required checks and respects
          # branch protection. It does not bypass anything: if a check fails the
          # pull request simply stays open.
          gh pr merge "$existing" --auto --merge
