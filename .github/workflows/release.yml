name: release

# Automated, lockstep releasing driven by Conventional Commits (which this repo
# already enforces). On every push to main, release-please maintains a single
# "release PR" that bumps the canonical version across ALL manifests (via
# extra-files in release-please-config.json) and writes the changelog. Merging
# that PR tags `vX.Y.Z` and cuts a GitHub release. No one hand-bumps a version.
#
# HITL is preserved and is exactly ONE deliberate human action: merging the
# release PR. That merge cuts the GitHub release, which fires the `publish` job
# below — a provenance-signed `pnpm publish` to npm. There is no separate
# "publish" button and no manual `npm publish` from a laptop: publishing only
# ever happens in CI, from tagged source, so `workspace:` rewrite + the
# check:publish guard + npm provenance are always applied. Pre-1.0 policy
# (config): feat -> minor, fix -> patch, breaking -> minor (bump-minor-pre-major).

on:
  push:
    branches: [main]
  # Manual re-publish of the CURRENT version on main — e.g. to complete a release
  # whose auto-publish failed (a CI misconfig), without cutting a new version.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # No downstream catalog to notify: the marketplace is self-hosted in this
      # repo (`.claude-plugin/marketplace.json`, local `./packages/...` sources
      # resolved at HEAD), so a release needs no sha re-pinning anywhere.

  # Tokenless, provenance-signed publish of voidharness via npm Trusted
  # Publishing (OIDC), gated on a release having been cut (i.e. a human merged the
  # release PR). NO npm token exists anywhere: `id-token: write` lets the runner
  # mint a short-lived, workflow-scoped credential that npm trusts, and provenance
  # is attached automatically. `pnpm publish` rewrites the internal `workspace:*`
  # dep to a real range; `check:publish` fails closed if any `workspace:`
  # specifier survives into a packed tarball.
  #
  # PREREQUISITE (one-time, see docs/RELEASING.md): npm Trusted Publishing can NOT
  # create a brand-new package — the trusted publisher is configured on an
  # EXISTING package's settings page. So v1 is bootstrapped by a single manual
  # `pnpm publish` (interactive 2FA, no stored token); the trusted publisher is
  # then linked to (org: voidcorp-core, repo: void-harness, workflow: release.yml),
  # and every release from the next one on publishes here with zero tokens.
  #
  # The repo's packageManager is pnpm 10 (bumped from 9 precisely because OIDC
  # trusted publishing landed in pnpm 10; 11.0.8 has a known 404 regression,
  # pnpm/pnpm#11513). action-setup reads the version from packageManager — no
  # `version:` input here (setting both errors: ERR_PNPM_BAD_PM_VERSION).
  publish:
    needs: release-please
    # Runs when a release was just cut (the normal path) OR on a manual dispatch
    # (re-publish the current version after a failed run). `always()` lets it
    # evaluate on dispatch even though the gating output is empty then.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      # NO `registry-url:` here, deliberately, and it must stay that way.
      # setup-node reacts to it by writing `//registry.npmjs.org/:_authToken=
      # ${NODE_AUTH_TOKEN}` into a temp .npmrc (and pointing NPM_CONFIG_USERCONFIG
      # at it), with NODE_AUTH_TOKEN defaulted to the literal placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX`. npm then sees a credential already configured,
      # never initiates the OIDC exchange, and authenticates with that garbage
      # token -- which the registry answers with a bare `E404 PUT /voidharness`,
      # a permission error wearing a not-found costume. See actions/setup-node#1551.
      # registry.npmjs.org is the default registry anyway, so the input bought
      # nothing and cost the whole trusted-publishing flow.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The release PR carries NO checks of its own: GitHub deliberately does not
      # trigger workflows for a pull request opened by the bot's GITHUB_TOKEN
      # (anti-recursion), so `ci.yml` never runs on release-please--branches--main.
      # Merging it therefore used to tag and publish a tree that no suite had run
      # against — the version bumps in particular are exactly what `version:check`
      # exists to catch, and they only ever appear on that unchecked branch.
      #
      # So the gate lives HERE, on the tree actually being published, rather than
      # trusting that main was green when the PR was cut. Publishing to npm is
      # irreversible; a failing step here costs a re-run, a bad publish costs a
      # deprecation notice forever.
      #
      # `pnpm build` FIRST, mirroring ci.yml: packs resolve cross-package imports
      # through their dist exports, so the type declarations must exist before
      # typecheck or it fails on unresolvable @voidcorp/* modules. Omitting it is
      # what made the first gated 2.0.0 run fail (correctly, but for the wrong
      # reason) and left the tag cut with nothing published.
      - name: Validate the tree being published
        run: |
          pnpm version:check
          pnpm build
          pnpm typecheck
          pnpm test

      # Guard: no `workspace:` specifier may survive into a published tarball.
      - run: pnpm check:publish
      # prepack (builds the kernel + CLI + core-assets) runs automatically, so the
      # published tarball is self-contained. --no-git-checks: the tag is already
      # cut; the tree is the release commit. No NODE_AUTH_TOKEN — auth is OIDC.
      - name: Publish to npm (OIDC trusted publishing, provenance auto)
        run: pnpm --filter voidharness publish --access public --no-git-checks
