name: promotion

# Keep a promotion pull request standing whenever develop is ahead of main.
#
# It opens one and never merges it. That is the whole point: merging it is the
# human gate, the moment someone says "what is on develop is ready to ship", and
# it is the only decision in the release cycle that is about content rather than
# mechanics. Everything after it, the release pull request and the back-merge,
# follows from it.
#
# What is automated here is the typing, not the judgement. The pull request was
# opened by hand every time, which costs nothing when you remember and costs a
# stale develop when you do not.
#
# No temporary branch: the promotion is develop into main, so develop is the
# head. The pull request updates itself as develop moves, which is why an
# existing one is left alone rather than recreated.

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the promotion when develop holds something main does not
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Content, not commit counts: a back-merge leaves a merge commit on
          # develop that main does not carry, and promoting that alone would be
          # a pull request with an empty diff.
          if git diff --quiet origin/main origin/develop; then
            echo "main already holds develop's tree; nothing to promote."
            exit 0
          fi

          if [ -n "$(gh pr list --head develop --base main --state open --json number --jq '.[0].number // empty')" ]; then
            echo "promotion pull request already open; it follows develop as it moves."
            exit 0
          fi

          # The log is the point of the body: this is the one pull request whose
          # diff is meant to be read as a whole, so it opens with what it carries.
          commits=$(git log --no-merges --format='- %s' origin/main..origin/develop | head -50)
          gh pr create --base main --head develop \
            --title 'chore: promote develop to main' \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              'Merging this is the release gate: it says what is on `develop` is ready to ship. Nothing here publishes anything by itself. Release-please proposes the version bump afterwards, and merging that one is what reaches npm.' \
              'Carried by this promotion:' \
              "$commits")"
