schemaVersion: 1
id: core:ticket-runner-team
version: 1
mode: team
plan:
  required: true
  source: mission-plan
writer:
  ownership: single
  completionEvent: lead-writer.completed
review:
  parallel: true
  independence: fresh-context
  context: plan-slice
  scopeEnforcement: assigned-lens-only
  writeAccess: none
  maxRounds: 2
  specialists:
    - core:solution-architect
    - core:security-engineer
    - core:test-qa-engineer
  completionEvent: specialist.completed
  failureEvent: specialist.failed
correction:
  owner: lead-writer
  invalidate: changed-inputs-only
verdict:
  requireFreshEvidence: true
  requireAllApplicableCompletions: true
  persistentBlockers: blocked
  timeout: blocked
