schemaVersion: 1
id: core:nextjs
version: 1
name: nextjs
technologies:
  - id: nextjs
    minimumVersion: 15.0.0
    maximumVersionExclusive: 18.0.0
detectors:
  always: false
  technologies: [nextjs]
  files:
    extensions: [.ts, .tsx, .js, .jsx, .css]
    names: [next.config.js, next.config.mjs, next.config.ts]
    pathSegments: [app, pages]
sources:
  - title: Next.js documentation
    url: https://nextjs.org/docs
reviewedAt: 2026-07-27
expiresAfterDays: 120
invariants:
  - Make server and client boundaries explicit and minimize client-side JavaScript.
  - Treat caching, revalidation, authorization, and request input as explicit contracts.
patterns:
  - id: app-router
    appliesWhen:
      technologies: [nextjs]
      files:
        extensions: [.ts, .tsx]
        names: []
        pathSegments: [app]
    guidance: Preserve App Router ownership, streaming boundaries, and server-first data flow.
  - id: framework-config
    appliesWhen:
      technologies: [nextjs]
      files:
        extensions: []
        names: [next.config.js, next.config.mjs, next.config.ts]
        pathSegments: []
    guidance: Validate configuration against the covered official Next.js documentation.
